---

volumes:
  qgis-settings:

services:

  qgis:
    image: camptocamp/qgis-dimensions-selector:${QGIS_VERSION:-4.2}
    volumes:
      - ${PWD}/dimensions_selector:/app/dimensions_selector
      - /tmp/.X11-unix:/tmp/.X11-unix
      - qgis-settings:/home/user/.local/share/QGIS
      - ./docker/xauth:/tmp/xauth:ro
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PYTHONPATH=/app:/usr/share/qgis/python/plugins/
      - QGIS_DEBUG=0
      - QGIS_LOG_FILE=/dev/null
      - QGIS_PLUGINPATH=/app
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/xauth
    entrypoint: ""
    command: qgis

  tester:
    image: camptocamp/qgis-dimensions-selector:${QGIS_VERSION:-4.2}
    volumes:
      - ${PWD}:/app
    environment:
      - PYTHONPATH=/app:/usr/local/share/qgis/python:/usr/share/qgis/python:/usr/share/qgis/python/plugins/
      - QGIS_DEBUG=0
      - QGIS_LOG_FILE=/dev/null
      - QGIS_PLUGINPATH=/app
      - PYTEST_ARGS=test
    command: make -f docker.mk pytest
