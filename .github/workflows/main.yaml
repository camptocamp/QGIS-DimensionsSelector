name: Continuous integration

on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+'
    tags:
      - '*'
  pull_request:

env:
  # QGIS version used for the version independent steps (linters)
  MAIN_QGIS_VERSION: '4.2'

jobs:
  main:
    runs-on: ubuntu-24.04
    name: QGIS ${{ matrix.qgis-version }}
    timeout-minutes: 90
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    strategy:
      fail-fast: false
      matrix:
        qgis-version:
          - '3.44'
          - '4.2'

    env:
      QGIS_VERSION: ${{ matrix.qgis-version }}

    steps:
      - uses: actions/checkout@v3

      - name: Build docker images and runtime files
        run: make build

      - name: Run linters
        run: make check
        if: env.QGIS_VERSION == env.MAIN_QGIS_VERSION

      - name: Run automated tests suite
        run: make test
